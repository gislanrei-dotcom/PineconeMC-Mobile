name: Native PineconeMC Android ARM64 - Portability build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-android-native.yml'
      - 'scripts/**'
      - 'android/**'
  workflow_dispatch:

# Avoid launching multiple 20-minute native toolchain builds for adjacent commits.
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  port-qt-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout native port branch
        uses: actions/checkout@v4
      - name: Checkout original PineconeMC (no FCL)
        uses: actions/checkout@v4
        with:
          repository: ElyPrismLauncher/Launcher
          ref: 9d6572797078947314b1f1737590bc157a259958
          path: PineconeMC
          submodules: recursive
      - name: Validate Python and patch original PineconeMC before expensive toolchain setup
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/patch_native.py scripts/validate_apk.py
          python3 scripts/patch_native.py PineconeMC

      - name: Test original JavaCheck and JNI JavaRunner on Linux host
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/test_java_runner.sh

      - name: Install Android cross-compiler
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git python3-pip python3-venv extra-cmake-modules pkg-config autoconf automake libtool
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Install matching Qt 6 Android and host developer tools
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt-env"
          "$RUNNER_TEMP/aqt-env/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/aqt-env/bin/pip" install aqtinstall==3.2.1
          "$RUNNER_TEMP/aqt-env/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/qt"
          "$RUNNER_TEMP/aqt-env/bin/aqt" install-qt linux android 6.8.3 android_arm64_v8a --modules qtnetworkauth --outputdir "$RUNNER_TEMP/qt"
          test -f "$RUNNER_TEMP/qt/6.8.3/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake"
      - name: Build original native dependencies for Android
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.1.10909125"
          export VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android cmark libarchive libqrencode tomlplusplus zlib
      - name: Configure original PineconeMC Qt Android build
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.1.10909125"
          export VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          cmake -S PineconeMC -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$RUNNER_TEMP/qt/6.8.3/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed" \
            -DECM_DIR=/usr/share/ECM/cmake \
            -DQT_HOST_PATH="$RUNNER_TEMP/qt/6.8.3/gcc_64" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DPINECONE_EXPERIMENTAL_JAVA_RUNNER=OFF \
            -DLauncher_BUILD_PLATFORM=android-arm64 \
            -DLauncher_USE_PCH=OFF \
            -DLauncher_ENABLE_JAVA_DOWNLOADER=OFF \
            -DLauncher_CURSEFORGE_API_KEY="" \
            -DBUILD_TESTING=OFF
      - name: Compile original PineconeMC Android native target
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-android --parallel 3

      - name: Bundle original PineconeMC icon
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/res/drawable
          cp PineconeMC/program_info/io.github.elyprismlauncher.ElyPrismLauncher_256.png android/res/drawable/pineconemc_icon.png
          file android/res/drawable/pineconemc_icon.png

      - name: Bundle original PineconeMC Java helper JARs in Android assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/assets/jars
          for JAR in NewLaunch.jar NewLaunchLegacy.jar JavaCheck.jar; do
            SOURCE="$(find build-android -type f -name "$JAR" -print -quit)"
            test -n "$SOURCE"
            test -s "$SOURCE"
            cp "$SOURCE" "android/assets/jars/$JAR"
          done

      # Qt 6.8's 'apk' target uses androiddeployqt and Gradle to bundle the
      # compiled original C++ application. It is NOT a functioning Java runtime.
      - name: Create diagnostic Android APK with Qt androiddeployqt
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-android --target apk --parallel 2

      - name: Verify Android ARM64 APK structure and package identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          mapfile -t APKS < <(find build-android -type f -name '*.apk' | sort)
          printf 'APK candidates:\\n%s\\n' "${APKS[*]}"
          test "${#APKS[@]}" -ge 1
          APK="${APKS[0]}"
          python3 scripts/validate_apk.py "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > out/android-package-info.txt
          grep -F "package: name='ru.pineconemc.mobile'" out/android-package-info.txt
          grep -F "sdkVersion:'28'" out/android-package-info.txt
          grep -F "targetSdkVersion:'35'" out/android-package-info.txt
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --min-sdk-version 28 "$APK"
          cp "$APK" out/PineconeMC-Mobile-Android-UI-SmokeTest.apk
          sha256sum out/PineconeMC-Mobile-Android-UI-SmokeTest.apk > out/PineconeMC-Mobile-Android-UI-SmokeTest.apk.sha256
          printf '%s\\n' 'PineconeMC native Android/Qt APK; UI smoke test only.' 'Minecraft Java runtime, graphics bridge, touch input and Ely.by sign-in remain unverified.' > out/NOT-YET-PLAYABLE.txt

      - name: Upload UNTESTED Qt UI APK for Android integration checks
        uses: actions/upload-artifact@v4
        with:
          name: PineconeMC-Native-ARM64-UI-SMOKE-ONLY
          path: out/
          if-no-files-found: error
          retention-days: 14

      # No GitHub Release: the original PineconeMC runtime still needs Android
      # Java Edition JVM / LWJGL graphics / touch and device testing.
