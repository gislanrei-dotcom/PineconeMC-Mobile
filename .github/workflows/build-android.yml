name: PineconeMC Mobile - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "PineconeMC-Mobile-fonte.zip"
      - "BUILD.md"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PineconeMC sources
        uses: actions/checkout@v4

      - name: Checkout the real FoldCraftLauncher engine
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/FoldCraftLauncher
          ref: f5bb1526eb371d81cb086d74cdb8535043b51ee4
          path: upstream
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The retired Android SDK 'tools' package breaks setup-android@v3
      # on current runners. Use the preinstalled Android command-line tools.
      - name: Install Android SDK 35, NDK 27 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Apply PineconeMC Android source overlay
        shell: bash
        run: |
          set -euxo pipefail
          test -s PineconeMC-Mobile-fonte.zip
          unzip -q PineconeMC-Mobile-fonte.zip "overlay/*"
          test -d overlay/FCL
          cp -a overlay/. upstream/
          test -f upstream/FCL/build.gradle.kts
          test -f upstream/debug-key.jks

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile ARM64 Minecraft Java launcher
        shell: bash
        env:
          OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
          CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
        run: |
          set -euxo pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew :FCL:assembleFordebug -Darch=arm64 --no-daemon --stacktrace --info 2>&1 | tee ../build.log

      - name: Verify signed ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          mapfile -t apk_files < <(find upstream/FCL/build/outputs/apk/fordebug -name "*.apk" -type f)
          test "${#apk_files[@]}" -eq 1
          cp "${apk_files[0]}" dist/PineconeMC-Mobile.apk
          unzip -t dist/PineconeMC-Mobile.apk | tail -n 3
          unzip -Z1 dist/PineconeMC-Mobile.apk | grep -q "^lib/arm64-v8a/"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose dist/PineconeMC-Mobile.apk
          sha256sum dist/PineconeMC-Mobile.apk > dist/PineconeMC-Mobile.apk.sha256

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PineconeMC-Mobile-ARM64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PineconeMC-Mobile-build-errors
          path: |
            build.log
            upstream/FCL/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14
