name: PineconeMC Mobile - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "PineconeMC-Mobile-fonte.zip"
      - "BUILD.md"

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PineconeMC sources
        uses: actions/checkout@v4

      - name: Checkout the real FoldCraftLauncher engine
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/FoldCraftLauncher
          ref: f5bb1526eb371d81cb086d74cdb8535043b51ee4
          path: upstream
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The retired Android SDK 'tools' package breaks setup-android@v3
      # on current runners. Use the preinstalled Android command-line tools.
      - name: Install Android SDK 35, NDK 27 and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Apply PineconeMC Android source overlay
        shell: bash
        run: |
          set -euxo pipefail
          test -s PineconeMC-Mobile-fonte.zip
          unzip -q PineconeMC-Mobile-fonte.zip "overlay/*"
          test -d overlay/FCL
          cp -a overlay/. upstream/
          # Apply audited source-level repairs and the native Pinecone home UI.
          cp -a patches/. upstream/
          test -f upstream/FCL/src/main/java/com/tungsten/fcl/ui/main/PineconeHomeView.java
          grep -q 'elyAuthenticationEndpoint("authenticate")' upstream/FCL/src/main/java/com/tungsten/fclcore/auth/authlibinjector/AuthlibInjectorProvider.java
          test -f upstream/FCL/build.gradle.kts
          test -f upstream/debug-key.jks

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile ARM64 Minecraft Java launcher
        shell: bash
        env:
          OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
          CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
        run: |
          set -euxo pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew :FCL:assembleFordebug -Darch=arm64 --no-daemon --stacktrace --info 2>&1 | tee ../build.log

      - name: Verify signed ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          mapfile -t apk_files < <(find upstream/FCL/build/outputs/apk/fordebug -name "*.apk" -type f)
          test "${#apk_files[@]}" -eq 1
          cp "${apk_files[0]}" dist/PineconeMC-Mobile.apk
          unzip -t dist/PineconeMC-Mobile.apk | tail -n 3
          unzip -Z1 dist/PineconeMC-Mobile.apk | grep -q "^lib/arm64-v8a/"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose dist/PineconeMC-Mobile.apk
          sha256sum dist/PineconeMC-Mobile.apk > dist/PineconeMC-Mobile.apk.sha256

      # GitHub Actions artifact storage is full for this account.
      # Upload the tested APK directly to a GitHub prerelease instead.
      - name: Publish installable APK as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="pinecone-mobile-debug-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/PineconeMC-Mobile.apk dist/PineconeMC-Mobile.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/PineconeMC-Mobile.apk dist/PineconeMC-Mobile.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PineconeMC Mobile ARM64 - Build ${GITHUB_RUN_NUMBER}" \
              --notes "Versão de teste compilada do FoldCraftLauncher com alterações PineconeMC. APK ARM64 assinado com chave de debug. Login Ely.by, instalação de versões e abertura de jogo ainda dependem de teste em Android real." \
              --prerelease
          fi
