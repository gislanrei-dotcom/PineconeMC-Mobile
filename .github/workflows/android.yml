name: PineconeMC Mobile ARM64
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FCL-Team/FoldCraftLauncher
          ref: f5bb1526eb371d81cb086d74cdb8535043b51ee4
          path: upstream
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Compilar para ARM64
        env:
          OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
          CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
        run: |
          unzip -q PineconeMC-Mobile-fonte.zip "overlay/*"
          cp -a overlay/. upstream/
          cd upstream
          bash gradlew :FCL:assembleFordebug -Darch=arm64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PineconeMC-Mobile-arm64
          path: upstream/FCL/build/outputs/apk/fordebug/*.apk
          if-no-files-found: error
