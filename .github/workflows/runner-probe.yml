name: GitHub Actions runner diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm Ubuntu runner was allocated
        shell: bash
        run: echo "CI_PROBE_LINUX_OK"
  probe-windows:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Confirm Windows runner was allocated
        shell: pwsh
        run: Write-Output "CI_PROBE_WINDOWS_OK"
