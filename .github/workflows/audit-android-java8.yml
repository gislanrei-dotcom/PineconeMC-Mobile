name: Audit real Android ARM64 Java 8 runtime
on:
  push:
    paths:
      - 'research/audit_java8.py'
      - '.github/workflows/audit-android-java8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned Java 8 Android ARM64 runtime archive
        run: |
          set -euxo pipefail
          python3 research/audit_java8.py
